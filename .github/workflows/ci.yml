name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: echo "Build Successful"

  unit-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Unit Tests
        run: |
          echo "Running tests..."
          python -c "raise Exception('Assertion Failed')"

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Integration
        run: echo "This job will not execute"

  deploy:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Deploy
        run: echo "Deploy"
